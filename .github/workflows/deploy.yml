name: Deploy to AWS

on:
  push:
    branches:
      - main
      - staging

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: clinica_estetica_api  
  ECR_REPOSITORY_WEB: laravel_nginx
  ECS_CLUSTER: clinica_estetica_api
  ECS_SERVICE: clinica_estetica_api
  CONTAINER_NAME: clinica_estetica_api

jobs:
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login no Amazon ECR
        run: |
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.$AWS_REGION.amazonaws.com

      - name: Construir e enviar a imagem Docker para o ECR
        run: |
          IMAGE_TAG=$(date +%Y%m%d%H%M%S)

          docker build -t $ECR_REPOSITORY_APP:$IMAGE_TAG .
          docker tag $ECR_REPOSITORY_APP:$IMAGE_TAG ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY_APP:$IMAGE_TAG
          docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY_APP:$IMAGE_TAG

          docker build -t $ECR_REPOSITORY_WEB:$IMAGE_TAG -f nginx/Dockerfile .
          docker tag $ECR_REPOSITORY_WEB:$IMAGE_TAG ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY_WEB:$IMAGE_TAG
          docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY_WEB:$IMAGE_TAG

          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Atualizar serviço no ECS
        run: |
          LATEST_TASK_DEF=$(aws ecs describe-task-definition --task-definition $ECS_SERVICE_APP --query taskDefinition | jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy, .tags)')
          NEW_TASK_DEF=$(echo $LATEST_TASK_DEF | jq --arg IMAGE "${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY_APP:$IMAGE_TAG" '.containerDefinitions[0].image = $IMAGE')
          NEW_TASK_REVISION=$(aws ecs register-task-definition --cli-input-json "$NEW_TASK_DEF" --query 'taskDefinition.revision' --output text)

          aws ecs update-service --cluster $ECS_CLUSTER --service $ECS_SERVICE_APP --task-definition $ECS_SERVICE_APP:$NEW_TASK_REVISION --force-new-deployment
