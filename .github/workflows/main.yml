name: Laravel CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root   # Defina a senha do root aqui
          MYSQL_DATABASE: clinida_estetica_testing  # Nome do banco de dados
        ports:
          - 3308:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          extensions: mbstring, pdo, pdo_mysql
          coverage: none

      - name: Install Composer dependencies
        run: |
          composer install --prefer-dist --no-progress --no-suggest
          composer dump-autoload

      - name: Copy environment file
        run: cp .env.testing .env

      - name: Generate application key
        run: php artisan key:generate --env=testing

      - name: Create custom MySQL configuration
        run: |
          # Cria o arquivo my.cnf com a configuração para ativar o innodb_large_prefix
          echo "[mysqld]" > my.cnf
          echo "innodb_large_prefix=1" >> my.cnf

      - name: Create Docker network
        run: docker network create github_network

      - name: Start MySQL container with custom config
        run: |
          # Rodar o MySQL com o arquivo de configuração customizado
          docker run -d --name mysql80 -p 3308:3306 --network github_network \
            -e MYSQL_ROOT_PASSWORD=root \
            -e MYSQL_DATABASE=clinida_estetica_testing \
            -v $(pwd)/my.cnf:/etc/mysql/my.cnf \
            mysql:8.0

      - name: Wait for MySQL
        run: sleep 15  # Aguarda o MySQL iniciar

      - name: Verify MySQL connection
        run: |
          until mysqladmin ping -h 127.0.0.1 -P 3308 --silent; do
            echo "Waiting for database..."
            sleep 5
          done

      - name: Run migrations
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3308
          DB_DATABASE: clinida_estetica_testing
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan migrate --env=testing --force

      - name: Run tests
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3308
          DB_DATABASE: clinida_estetica_testing
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test
