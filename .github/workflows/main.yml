name: Laravel CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root   # Defina a senha do root aqui
          MYSQL_DATABASE: clinida_estetica_testing  # Nome do banco de dados
        ports:
          - 3306 # Port binding will be handled by Docker
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          extensions: mbstring, pdo, pdo_mysql
          coverage: none

      - name: Install Composer dependencies
        run: |
          composer install --prefer-dist --no-progress --no-suggest
          composer dump-autoload

      - name: Copy environment file
        run: cp .env.testing .env

      - name: Generate application key
        run: php artisan key:generate --env=testing

      - name: Create custom MySQL configuration
        run: |
          # Cria o arquivo my.cnf com a configuração para ativar o innodb_large_prefix
          echo "[mysqld]" > my.cnf
          echo "innodb_large_prefix=1" >> my.cnf

      - name: Create Docker network
        run: docker network create github_network

      - name: Start MySQL container with custom config
        run: |
          # Rodar o MySQL com o arquivo de configuração customizado
          docker run -d --name mysql80 --network github_network \
            -e MYSQL_ROOT_PASSWORD=root \
            -e MYSQL_DATABASE=clinida_estetica_testing \
            -v $(pwd)/my.cnf:/etc/mysql/my.cnf \
            mysql:8.0
          
          # Pega a porta alocada pelo Docker para o MySQL
          MYSQL_PORT=$(docker port mysql80 3306 | cut -d':' -f2)
          echo "MySQL is running on port $MYSQL_PORT"

      - name: Wait for MySQL to be ready
        run: |
          echo "Waiting for MySQL to be available on port $MYSQL_PORT"
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -P $MYSQL_PORT --silent; then
              echo "MySQL is ready!"
              break
            else
              echo "Waiting for MySQL... Attempt $i"
              sleep 5
            fi
          done

      - name: Run migrations
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1  # Usando o endereço IP para garantir a conexão
          DB_PORT: $MYSQL_PORT
          DB_DATABASE: clinida_estetica_testing
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan migrate --env=testing --force

      - name: Run tests
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1  # Usando o endereço IP para garantir a conexão
          DB_PORT: $MYSQL_PORT
          DB_DATABASE: clinida_estetica_testing
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test
