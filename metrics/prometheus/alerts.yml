groups:
  - name: laravel-alerts
    rules:
      - alert: LaravelHighErrorRate
        expr: increase(http_errors_total[5m]) > 10
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Laravel está com alto índice de erros 500"
          description: "Mais de 10 erros HTTP nos últimos 5 minutos."

  - name: rabbitmq-queue-alerts
    rules:
      - alert: RabbitMQQueueBacklog
        expr: rabbitmq_queue_messages_ready > 100
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Fila do RabbitMQ acumulando mensagens"
          description: "Mais de 100 mensagens pendentes na fila."
