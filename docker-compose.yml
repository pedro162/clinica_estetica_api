version: '3.8'

services:
  app:
    build: 
      context: .
      dockerfile: .docker/Dockerfile
    container_name: laravel_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    depends_on:
      - db
    networks:
      - laravel

  web:
    build:
      context: .
      dockerfile: .docker/Dockerfile.nginx
    container_name: laravel_nginx
    restart: unless-stopped
    ports:
      - "8001:80"
    volumes:
      - .:/var/www
    depends_on:
      - app
    networks:
      - laravel

  db:
    image: mysql:8.0
    container_name: laravel_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
    volumes:
      - db_data:/var/lib/mysql    
    ports:
      - "3308:3306"
    networks:
      - laravel
  
  redis:
    image: redis:latest
    container_name: laravel_redis
    restart: unless-stopped
    ports:
      - "6380:6379"

  queue:
    build:
      context: .
      dockerfile: .docker/Dockerfile
    container_name: laravel_queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["php", "artisan", "queue:work"]
    depends_on:
      - db
      - redis
    volumes:
      - .:/var/www/html

volumes:
  db_data:

networks:
  laravel:
    driver: bridge
