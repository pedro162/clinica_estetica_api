version: '3.8'

services:
  app:
    build: 
      context: .
      dockerfile: .docker/Dockerfile
    container_name: laravel_app
    restart: unless-stopped
    environment:
      - CONTAINER_NAME=CONTAINER_01
    working_dir: /var/www
    volumes:
      - .:/var/www
      - /var/www/public/build
      - build_assets:/var/www/public/build
      - ./.docker/php/docker-php-ext-xdebug.ini:/usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini
    depends_on:
      - db
    networks:
      - laravel

  web:
    build:
      context: .
      dockerfile: .docker/Dockerfile.nginx
    container_name: laravel_nginx
    restart: unless-stopped
    ports:
      - "8001:80"
    volumes:
      - .:/var/www
      - build_assets:/var/www/public/build
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - laravel
    
  coverage:
    image: nginx:alpine
    container_name: coverage_reports
    volumes:
      - ./coverage/html:/usr/share/nginx/html:ro
    ports:
      - "8002:80"
    depends_on:
      - app
    networks:
      - laravel

  db:
    image: mysql:8.0
    container_name: laravel_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
    volumes:
      - db_data:/var/lib/mysql    
    ports:
      - "3308:3306"
    networks:
      - laravel
  db_read:
    image: mysql:8.0
    container_name: laravel_db_read
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: clinica_estetica
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
    command: --server-id=2 --relay-log=mysql-relay-bin --read-only=1
    depends_on:
      - db
    ports:
      - "3309:3306"
    networks:
      - laravel
    volumes:
      - db_read_data:/var/lib/mysql
  redis:
    image: redis:latest
    container_name: laravel_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    networks:
      - laravel

  queue:
    build:
      context: .
      dockerfile: .docker/Dockerfile.queue
    container_name: laravel_queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["php", "artisan", "queue:work"]
    depends_on:
      - db
      - redis
      - rabbitmq
    volumes:
      - .:/var/www/html
    networks:
      - laravel
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    networks:
      - laravel

  rabbitmq-exporter:
    image: kbudde/rabbitmq-exporter
    container_name: rabbitmq_exporter
    ports:
      - "9419:9419"
    environment:
      RABBIT_URL: http://admin:admin@rabbitmq:15672
    depends_on:
      - rabbitmq
    networks:
      - laravel

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    volumes:
      - ./metrics/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./metrics/prometheus/alerts.yml:/etc/prometheus/alerts.yml
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"    
    command:
       - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - laravel

  grafana:
    image: grafana/grafana:10.4.1
    container_name: grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./metrics/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./metrics/grafana/dashboards:/etc/grafana/provisioning/dashboards
    depends_on:
      - prometheus
    networks:
      - laravel
  alertmanager:
    image: prom/alertmanager:v0.27.0
    ports:
      - "9093:9093"
    volumes:
      - ./metrics/alertmanager:/etc/alertmanager
      - alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    networks:
      - laravel
volumes:
  db_data:
  db_read_data:
  grafana-storage:
  prometheus-data:
  alertmanager-data:
  build_assets:
networks:
  laravel:
    driver: bridge
