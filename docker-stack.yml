version: "3.8"

services:
  # --- APLICAÇÃO PHP (ESCALÁVEL) ---
  laravel_app:
    image: localhost:5000/laravel-app:latest
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure
    working_dir: /var/www
    environment:
      - CONTAINER_NAME=SWARM_NODE
    volumes:
      - .:/var/www
      - build_assets:/var/www/public/build
    networks:
      - laravel

  # --- SERVIDOR WEB (NGINX) ---
  web:
    image: localhost:5000/laravel-nginx:latest
    ports:
      - "8001:80"
    deploy:
      replicas: 1
    volumes:
      - .:/var/www
      - build_assets:/var/www/public/build
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - laravel

  # --- WORKER DE FILA (QUEUE) ---
  queue:
    image: localhost:5000/laravel-queue:latest
    working_dir: /var/www/html
    command: ["php", "artisan", "queue:work"]
    deploy:
      replicas: 1
    volumes:
      - .:/var/www/html
    networks:
      - laravel

  # --- BANCO DE DADOS (MYSQL) ---
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - laravel

  # --- REDIS (SESSÕES E CACHE) ---
  redis:
    image: redis:latest
    networks:
      - laravel

  # --- RABBITMQ (BROKER) ---
  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    networks:
      - laravel

  # --- MONITORAMENTO (PROMETHEUS) ---
  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./metrics/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./metrics/prometheus/alerts.yml:/etc/prometheus/alerts.yml
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    networks:
      - laravel

  # --- DASHBOARDS (GRAFANA) ---
  grafana:
    image: grafana/grafana:10.4.1
    ports:
      - "3001:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./metrics/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./metrics/grafana/dashboards:/etc/grafana/provisioning/dashboards
    networks:
      - laravel

networks:
  laravel:
    driver: overlay
    driver_opts:
      com.docker.network.driver.mtu: 1400

volumes:
  db_data:
  db_read_data:
  grafana-storage:
  prometheus-data:
  alertmanager-data:
  build_assets:
